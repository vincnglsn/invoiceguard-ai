name: InvoiceGuard AI — Deploy & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─── Tests et validation ────────────────────────────────────────────────────
  test:
    name: Validation Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dependances
        run: pip install -r requirements.txt

      - name: Verifier la syntaxe Python
        run: |
          python -m py_compile invoiceguard_app.py
          python -m py_compile streamlit_app.py
          python -m py_compile modules/database.py
          python -m py_compile modules/ai_agent.py
          python -m py_compile modules/invoice_scanner.py
          python -m py_compile modules/campaign.py
          python -m py_compile modules/email_sender.py
          python -m py_compile webhook_stripe.py
          python -m py_compile invoiceguard_legal.py
          echo "Tous les modules Python sont valides"

      - name: Test imports modules critiques
        run: |
          python -c "from modules import invoice_scanner, campaign, dashboard; print('Modules OK')"

      - name: Test base de donnees SQLite
        run: |
          python -c "
          from modules import database as db
          db.init_db()
          uid = db.upsert_user('test@ci.fr', 'CI Test', 'CI Corp', 'trial')
          assert uid > 0
          db.save_lead('lead@ci.fr', 'Lead CI', 'Corp CI', '', 100000, 'ci')
          stats = db.get_founder_stats()
          assert stats['total_users'] >= 1
          print('Base de donnees SQLite : OK')
          "

      - name: Test chargement donnees demo
        run: |
          python -c "
          from modules import invoice_scanner
          df = invoice_scanner.load_demo_data()
          assert len(df) > 0
          assert 'client' in df.columns
          assert 'score_risque' in df.columns
          print(f'Donnees demo : {len(df)} factures chargees')
          "

  # ─── Notification de deploiement ────────────────────────────────────────────
  notify:
    name: Notification deploiement
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      TELEGRAM_TOKEN:  ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Notification Telegram
        if: env.TELEGRAM_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          COMMIT_SHA: ${{ github.sha }}
          BRANCH:     ${{ github.ref_name }}
          ACTOR:      ${{ github.actor }}
        run: |
          # Les secrets collent souvent un retour a la ligne ou une espace :
          # un seul caractere de controle suffit a rendre l'URL invalide.
          TOKEN=$(printf '%s' "$TELEGRAM_TOKEN"   | tr -d '[:space:]')
          CHAT=$(printf  '%s' "$TELEGRAM_CHAT_ID" | tr -d '[:space:]')

          if ! printf '%s' "$TOKEN" | grep -qE '^[0-9]+:[A-Za-z0-9_-]+$'; then
            echo "Le secret TELEGRAM_TOKEN est mal forme."
            echo "Format attendu : <id_du_bot>:<cle>  (ex: 1234567890:AAH...)"
            echo "Longueur recue apres nettoyage : ${#TOKEN} caracteres"
            exit 1
          fi
          if ! printf '%s' "$CHAT" | grep -qE '^-?[0-9]+$'; then
            echo "Le secret TELEGRAM_CHAT_ID est mal forme (attendu : un entier)."
            echo "Longueur recue apres nettoyage : ${#CHAT} caracteres"
            exit 1
          fi

          TEXT=$(printf 'InvoiceGuard AI deploye avec succes\n\nCommit: %s\nBranch: %s\nAuteur: %s\n\nhttps://github.com/vincnglsn/invoiceguard-ai' \
            "$COMMIT_SHA" "$BRANCH" "$ACTOR")
          jq -n --arg chat "$CHAT" --arg text "$TEXT" \
            '{chat_id: $chat, text: $text, parse_mode: "HTML"}' \
          | curl -sS --fail-with-body -X POST \
              "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              --data @-
          echo "Notification Telegram envoyee"

      - name: Resume deploiement
        run: |
          echo "Deploiement InvoiceGuard AI"
          echo "Commit  : ${{ github.sha }}"
          echo "Auteur  : ${{ github.actor }}"
          echo "Branch  : ${{ github.ref_name }}"
          echo "Status  : SUCCESS - tous les tests passes"
